name: ArenaCore
version: '0.1.0-SNAPSHOT'
main: com.arenashowdown.core.ArenaCorePlugin
api-version: '1.21.11'
authors: [Arena Showdown]
description: Núcleo de campeonatos e pontuação do Arena Showdown
commands:
  arena:
    description: Administração e consulta do Arena Showdown
    usage: /arena help
permissions:
  arena.admin:
    description: Gerencia campeonatos e pontuação
    default: op
  arena.play:
    description: Participa e consulta campeonatos
    default: true
